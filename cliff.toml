# git-cliff config — changelog from Conventional Commits (doc §8.5).
# Regenerate: git cliff --output CHANGELOG.md   (unreleased: --unreleased)

[changelog]
header = """
# Changelog

All notable changes to this project will be documented here.
Format follows Conventional Commits; versions follow SemVer.

"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI" },
    { message = "^build|^chore", group = "Maintenance" },
    { message = "^revert", skip = true },
    { body = ".*security", group = "Security" },
]
filter_commits = false
sort_commits = "oldest"
