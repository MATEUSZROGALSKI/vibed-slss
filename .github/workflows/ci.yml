name: ci

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: ci-win }
          - { os: ubuntu-24.04, preset: ci-linux }
          - { os: macos-15, preset: ci-mac }
          # Debug configs — dev-* presets configure CMAKE_BUILD_TYPE=Debug.
          - { os: windows-2022, preset: dev-win }
          - { os: ubuntu-24.04, preset: dev-linux }
          - { os: macos-15, preset: dev-mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: master

      - name: Cache Cinder sources
        id: cinder-cache
        uses: actions/cache@v4
        with:
          path: build/_deps/cinder-src
          key: cinder-0.9.3-${{ runner.os }}-${{ hashFiles('cmake/CinderFetch.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Core isolation check
        run: python tools/ci/check_core_isolation.py

      - name: Format check
        run: |
          find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

      - name: Unit + integration tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: master
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure (compile DB, core only)
        run: cmake --preset dev-linux -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # Hard gate on NEW code: any .cpp touched by the PR/push must be
      # clean for correctness-critical check groups. The full-codebase
      # pass below stays advisory until the backlog is cleaned up.
      - name: clang-tidy gate (changed files)
        run: |
          BASE=${{ github.event.pull_request.base.sha || github.event.before }}
          git fetch --no-tags origin $BASE 2>/dev/null || true
          CHANGED=$(git diff --name-only ${BASE}...HEAD 2>/dev/null \
              | grep -E '^(src|tests)/.*\.(cpp|mm)$' || true)
          if [ -z "$CHANGED" ]; then
              echo "no changed C++ files"; exit 0
          fi
          echo "$CHANGED" | xargs clang-tidy -p build/dev-linux \
              --warnings-as-errors='bugprone-*,clang-analyzer-*' \
              --quiet || exit 1
      - name: clang-tidy report (advisory, full tree)
        run: |
          find src tests -name '*.cpp' -print0 \
            | xargs -0 -n1 -P4 clang-tidy -p build/dev-linux \
              --warnings-as-errors= 2>&1 | tee clang-tidy.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy.log

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: master
      - run: pip install gcovr
      - name: Configure + build (coverage, core only)
        run: |
          cmake --preset dev-linux -DCMAKE_CXX_FLAGS="--coverage -O0" \
                -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build --preset dev-linux -j
      - name: Run tests
        run: ctest --preset dev-linux --output-on-failure
      - name: Coverage report
        # G6 target: >=70% line coverage on core. Measured ~82%
        # (2026-02); floor kept at 70 with margin for runner variance.
        run: |
          gcovr --root . --object-directory build/dev-linux \
                --filter 'src/' --exclude 'src/platform' \
                --gcov-ignore-errors=no_working_dir_found \
                --txt --html-details coverage.html --print-summary \
                --fail-under-line 70
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage*.html

  # §9.6 platform smoke: exercise every built host binary with its safe
  # non-GL CLI surface on each OS runner. Real desktop/VM coverage
  # (session activation, .scr contract on a live desktop, xscreensaver)
  # needs self-hosted runners — out of scope for hosted CI.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: ci-win }
          - { os: ubuntu-24.04, preset: ci-linux }
          - { os: macos-15, preset: ci-mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: master
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}

      - name: Windows host smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $host = "build/${{ matrix.preset }}/src/platform/win/slc_host_win.exe"
          & $host --help | Out-Null; if ($LASTEXITCODE -ne 0) { exit 1 }
          # --ctl without a session must fail cleanly with the canned text.
          $out = & $host --ctl STATUS 2>&1
          if ($out -notmatch 'no session listening') {
              Write-Error "unexpected --ctl output: $out"; exit 1 }

      - name: Linux host smoke
        if: runner.os == 'Linux'
        run: |
          HOST=build/${{ matrix.preset }}/src/platform/linux/slc_host_linux
          "$HOST" --help
          # secret-tool absent on runners → expected failure path.
          "$HOST" --store-sgdb-key dummy || true
          "$HOST" --list-artwork || true  # no Steam on runner

      - name: macOS bundle smoke
        if: runner.os == 'macOS'
        run: |
          find build/${{ matrix.preset }} -name '*.saver' -o \
              -name '*.app' | head -5

  # §9.6 live-desktop smoke — real session activation, .scr contract,
  # xscreensaver registration. Requires self-hosted runners with a real
  # desktop; enable by adding a `self-hosted` runner and setting repo
  # variable SLC_SELF_HOSTED_SMOKE=1.
  smoke-desktop:
    if: vars.SLC_SELF_HOSTED_SMOKE == '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
      - run: cmake --preset dev-${{ runner.os == 'Windows' && 'win' || 'linux' }}
      - run: cmake --build --preset dev-${{ runner.os == 'Windows' && 'win' || 'linux' }}
      - name: Live session smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $host = "build/dev-win/src/platform/win/slc_host_win.exe"
          # Fullscreen session for 5s, then STATUS through the pipe.
          $p = Start-Process $host -ArgumentList '/s' -PassThru
          Start-Sleep 5
          & $host --ctl STATUS
          & $host --ctl RELOAD
          Stop-Process -Id $p.Id -Force

      - name: Live session smoke (Linux/Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          HOST=build/dev-linux/src/platform/linux/slc_host_linux
          xvfb-run -a "$HOST" --run &
          sleep 5
          busctl --user call io.github.slc.Control \
              /io/github/slc/Control io.github.slc.Control GetStatus || true
          kill %1 || true

  # §9.4 visual regression under Xvfb + llvmpipe — the golden tolerates
  # software-rasterizer AA differences.
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: master
      - name: GL deps
        run: sudo apt-get update && sudo apt-get install -y xvfb \
             libgl1-mesa-dri libglx-mesa0 libegl1 libx11-dev libxrandr-dev \
             libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure + build harness
        run: |
          cmake --preset dev-linux -DSLC_BUILD_CINDER=ON
          cmake --build --preset dev-linux --target slc_visual -j
      - name: Compare against golden
        run: xvfb-run -a build/dev-linux/tests/slc_visual --compare \
             tests/visual/golden/collage.png

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate API docs
        run: doxygen Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/html/

  artifacts:
    needs: build-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
      - run: cmake --preset ci-win
      - run: cmake --build --preset ci-win --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: SteamLibraryScreensaver-snapshot
          path: |
            build/ci-win/src/platform/win/SteamLibraryScreensaver.scr
            build/ci-win/src/platform/win/slc_host_win.exe
