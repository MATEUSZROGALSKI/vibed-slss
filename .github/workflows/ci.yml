name: ci

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: ci-win }
          - { os: ubuntu-24.04, preset: ci-linux }
          - { os: macos-15, preset: ci-mac }
          # Debug configs — dev-* presets configure CMAKE_BUILD_TYPE=Debug.
          - { os: windows-2022, preset: dev-win }
          - { os: ubuntu-24.04, preset: dev-linux }
          - { os: macos-15, preset: dev-mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: master

      - name: Cache Cinder sources
        id: cinder-cache
        uses: actions/cache@v4
        with:
          path: build/_deps/cinder-src
          key: cinder-0.9.3-${{ runner.os }}-${{ hashFiles('cmake/CinderFetch.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Core isolation check
        run: python tools/ci/check_core_isolation.py

      - name: Format check
        run: |
          find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

      - name: Unit + integration tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: master
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure (compile DB, core only)
        run: cmake --preset dev-linux -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # Advisory for now: report violations, don't fail the build while the
      # existing codebase is being cleaned up to .clang-tidy's checks.
      - name: clang-tidy report
        run: |
          find src tests -name '*.cpp' -print0 \
            | xargs -0 -n1 -P4 clang-tidy -p build/dev-linux \
              --warnings-as-errors= 2>&1 | tee clang-tidy.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy.log

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: master
      - run: pip install gcovr
      - name: Configure + build (coverage, core only)
        run: |
          cmake --preset dev-linux -DCMAKE_CXX_FLAGS="--coverage -O0" \
                -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build --preset dev-linux -j
      - name: Run tests
        run: ctest --preset dev-linux --output-on-failure
      - name: Coverage report
        run: |
          gcovr --root . --object-directory build/dev-linux \
                --filter 'src/' --exclude 'src/platform' \
                --txt --html-details coverage.html --print-summary
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage*.html

  # §9.6 platform smoke: exercise every built host binary with its safe
  # non-GL CLI surface on each OS runner. Real desktop/VM coverage
  # (session activation, .scr contract on a live desktop, xscreensaver)
  # needs self-hosted runners — out of scope for hosted CI.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: ci-win }
          - { os: ubuntu-24.04, preset: ci-linux }
          - { os: macos-15, preset: ci-mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: master
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}

      - name: Windows host smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $host = "build/${{ matrix.preset }}/src/platform/win/slc_host_win.exe"
          & $host --help | Out-Null; if ($LASTEXITCODE -ne 0) { exit 1 }
          # --ctl without a session must fail cleanly with the canned text.
          $out = & $host --ctl STATUS 2>&1
          if ($out -notmatch 'no session listening') {
              Write-Error "unexpected --ctl output: $out"; exit 1 }

      - name: Linux host smoke
        if: runner.os == 'Linux'
        run: |
          HOST=build/${{ matrix.preset }}/src/platform/linux/slc_host_linux
          "$HOST" --help
          # secret-tool absent on runners → expected failure path.
          "$HOST" --store-sgdb-key dummy || true
          "$HOST" --list-artwork || true  # no Steam on runner

      - name: macOS bundle smoke
        if: runner.os == 'macOS'
        run: |
          find build/${{ matrix.preset }} -name '*.saver' -o \
              -name '*.app' | head -5

  # §9.4 visual regression under Xvfb + llvmpipe — the golden tolerates
  # software-rasterizer AA differences.
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: master
      - name: GL deps
        run: sudo apt-get update && sudo apt-get install -y xvfb \
             libgl1-mesa-dri libglx-mesa0 libegl1 libx11-dev libxrandr-dev \
             libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure + build harness
        run: |
          cmake --preset dev-linux -DSLC_BUILD_CINDER=ON
          cmake --build --preset dev-linux --target slc_visual -j
      - name: Compare against golden
        run: xvfb-run -a build/dev-linux/tests/slc_visual --compare \
             tests/visual/golden/collage.png

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate API docs
        run: doxygen Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/html/

  artifacts:
    needs: build-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
      - run: cmake --preset ci-win
      - run: cmake --build --preset ci-win --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: SteamLibraryScreensaver-snapshot
          path: |
            build/ci-win/src/platform/win/SteamLibraryScreensaver.scr
            build/ci-win/src/platform/win/slc_host_win.exe
